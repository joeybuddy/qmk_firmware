name: Build Keychron Keyboards

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    container: ghcr.io/qmk/qmk_cli
    
    strategy:
      matrix:
        keyboard:
          - keychron/k2_pro/ansi/rgb
          - keychron/k3_pro/ansi/rgb
          - keychron/q8_pro/ansi_encoder
    
    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'
      
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Build firmware
        run: qmk compile -kb ${{ matrix.keyboard }} -km via
      
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.keyboard }}
          path: |
            .build/*.bin
            .build/*.hex
            .build/*.uf2
          if-no-files-found: error
